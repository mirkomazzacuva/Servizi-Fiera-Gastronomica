<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fiera Gastronomica - Disponibilità</title><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><main class="shell"><header class="topbar"><div><div class="eyebrow">FIERA GASTRONOMICA</div><h1>Quando ci sei?</h1><p>Indica le serate in cui sei realmente disponibile.</p></div><a class="ghost" href="admin.html">Admin</a></header>
<section class="card"><h2>I tuoi dati</h2><div class="grid2"><label>Nome e cognome<input id="name" placeholder="Mario Rossi"></label><label>Telefono<input id="phone" placeholder="333 1234567"></label></div><label>Gruppo / compagnia<input id="group" placeholder="Facoltativo"></label></section>
<section class="card"><div class="row"><div><h2>Serate disponibili</h2><p>Per ogni serata scegli Cucina, Servizio o Entrambi.</p></div><span id="count" class="pill">0 selezionate</span></div><div id="dates"></div></section>
<section class="card"><label>Note<textarea id="notes" placeholder="Orari particolari, esigenze, ecc."></textarea></label><button id="submit">Invia disponibilità</button><div id="msg"></div></section></main><script src="app.js"></script></body></html>
