name: Installa/Aggiorna App Fiera da ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'fiera-release.zip'

permissions:
  contents: write

concurrency:
  group: fiera-release-installer
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifica pacchetto
        shell: bash
        run: |
          set -e
          if [ ! -f "fiera-release.zip" ]; then
            echo "ERRORE: fiera-release.zip non trovato nella root del repository."
            exit 1
          fi
          echo "Pacchetto trovato."
          unzip -t fiera-release.zip

      - name: Backup configurazione Supabase
        shell: bash
        run: |
          set -e
          if [ -f "config.js" ]; then
            cp config.js /tmp/config.js
            echo "config.js salvato."
          fi

      - name: Installa aggiornamento
        shell: bash
        run: |
          set -e
          rm -rf .fiera_update
          mkdir .fiera_update
          unzip -o fiera-release.zip -d .fiera_update

          # Copia solo i file dell'app. Il pacchetto non contiene config.js.
          cp -f .fiera_update/index.html .
          cp -f .fiera_update/admin.html .
          cp -f .fiera_update/confirm.html .
          cp -f .fiera_update/diagnostics.html .
          cp -f .fiera_update/styles.css .
          cp -f .fiera_update/app.js .
          cp -f .fiera_update/admin.js .
          cp -f .fiera_update/confirm.js .
          cp -f .fiera_update/diagnostics.js .
          cp -f .fiera_update/manifest.webmanifest .
          cp -f .fiera_update/sw.js .
          cp -f .fiera_update/version.js .

          rm -rf .fiera_update

          if [ -f "/tmp/config.js" ]; then
            cp /tmp/config.js config.js
          fi

          echo "Installazione completata. config.js preservato."

      - name: Commit automatico
        shell: bash
        run: |
          set -e
          git config user.name "Fiera Auto Installer"
          git config user.email "actions@github.com"

          git add \
            index.html admin.html confirm.html diagnostics.html \
            styles.css app.js admin.js confirm.js diagnostics.js \
            manifest.webmanifest sw.js version.js

          if git diff --cached --quiet; then
            echo "Nessuna modifica dell'app da pubblicare."
          else
            git commit -m "Aggiorna Gestione Fiera da fiera-release.zip"
            git push
          fi
