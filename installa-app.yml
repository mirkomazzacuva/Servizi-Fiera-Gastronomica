name: Installa/Aggiorna App Fiera
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/installa-app.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installa file applicazione
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          files = {}
          files['index.html'] = ''
          files['admin.html'] = ''
          files['confirm.html'] = ''
          files['diagnostics.html'] = ''
          files['styles.css'] = ''
          files['app.js'] = ''
          files['admin.js'] = ''
          files['confirm.js'] = ''
          for name, data in files.items():
              pathlib.Path(name).write_bytes(base64.b64decode(data))
          print(f'Installati {len(files)} file. config.js preservato.')
          PY
      - name: Commit automatico
        shell: bash
        run: |
          git config user.name 'Fiera Installer'
          git config user.email 'actions@github.com'
          git add index.html admin.html confirm.html diagnostics.html styles.css app.js admin.js confirm.js
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da pubblicare.'
          else
            git commit -m 'Aggiorna Gestione Fiera automaticamente'
            git push
          fi