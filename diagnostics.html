<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostica Fiera</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="shell narrow"><header class="topbar"><div><div class="eyebrow">GESTIONE FIERA</div><h1>Diagnostica</h1><p>Controllo automatico configurazione e database.</p></div><a class="ghost" href="admin.html">Admin</a></header><section class="card"><button id="run">Esegui diagnostica</button><div id="results" class="diag"></div></section></main><script>
const out=document.getElementById('results'); const add=(ok,t,d='')=>out.innerHTML+=`<div class="diagrow ${ok?'ok':'bad'}"><b>${ok?'✓':'✕'} ${t}</b><small>${d}</small></div>`;
document.getElementById('run').onclick=async()=>{out.innerHTML=''; try{add(!!window.FIERA_CONFIG,'config.js caricato'); const c=window.FIERA_CONFIG||{}; add(/^https:\/\/.+\.supabase\.co$/.test(c.SUPABASE_URL||''),'URL Supabase',c.SUPABASE_URL||'mancante'); add((c.SUPABASE_ANON_KEY||'').length>20,'Publishable key'); const s=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY); for (const t of ['event_dates','pavilions','people','availability']){const {error}=await s.from(t).select('*',{count:'exact',head:true}); add(!error,'Tabella '+t,error?.message||'OK');}}catch(e){add(false,'Errore generale',e.message)}}; document.getElementById('run').click();
</script></body></html>
