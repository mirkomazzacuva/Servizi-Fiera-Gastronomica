<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiera Admin</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="loginView" class="shell login"><div class="card hero"><div class="brand">Fiera Gastronomica</div><h1 style="font-size:38px;margin-top:20px">Area organizzatori</h1><p>Accedi con l'account amministratore configurato in Supabase.</p><form id="loginForm" class="section"><div class="field"><label>Email</label><input id="email" class="input" type="email" required></div><div class="field section"><label>Password</label><input id="password" class="input" type="password" required></div><button class="btn btn-primary btn-block section">Accedi</button><div id="loginMsg" class="section"></div></form></div></div>
<div id="appView" style="display:none"><div class="shell"><div class="topbar"><div><div class="brand">Gestione Fiera</div><div class="sub" id="adminEmail"></div></div><button class="btn btn-secondary" id="logout">Esci</button></div><div class="nav" id="nav"><button class="active" data-tab="overview">Panoramica</button><button data-tab="nights">Serate</button><button data-tab="availability">Disponibilità</button><button data-tab="people">Persone</button><button data-tab="settings">Impostazioni</button></div>
<div id="overview" class="panel active section"></div><div id="nights" class="panel section"></div><div id="availability" class="panel section"></div><div id="people" class="panel section"></div><div id="settings" class="panel section"></div></div></div>
<div class="modal-backdrop" id="modalBack"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
